apiVersion: v1
kind: ServiceAccount
metadata:
  name: health-dashboard
  namespace: caritas
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: health-dashboard-read-workloads
  namespace: caritas
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: health-dashboard-read-workloads
  namespace: caritas
subjects:
  - kind: ServiceAccount
    name: health-dashboard
    namespace: caritas
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: health-dashboard-read-workloads
