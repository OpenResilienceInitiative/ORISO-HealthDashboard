name: Reusable Docker build, scan and publish steps
description: Scan the OCI archive before publishing the same image to GHCR

inputs:
  push_to_ghcr:
    description: Whether to publish the image to GHCR
    required: true
  image_name:
    description: Image name without the registry and organization
    required: true
  github_token:
    description: GitHub token used only to publish to GHCR
    required: false
    default: ''
  image_tags:
    description: Explicit image tags for a versioned release
    default: ''
  image_labels:
    description: Explicit OCI labels for a versioned release
    default: ''

outputs:
  archive_sha256:
    description: SHA-256 of the verified and scanned OCI archive
    value: ${{ steps.scan.outputs.archive_sha256 }}

runs:
  using: 'composite'
  steps:
  - name: Set up Docker Buildx
    uses: docker/setup-buildx-action@v4

  - name: Extract Metadata
    id: meta
    if: ${{ inputs.image_tags == '' }}
    uses: docker/metadata-action@v6
    with:
      images: ${{ env.REGISTRY }}/${{ env.ORG }}/${{ inputs.image_name }}
      tags: |
        type=sha
        type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
        type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
        type=raw,value=pre-dev,enable=${{ github.ref == 'refs/heads/pre-dev' }}

  - name: Build the complete amd64 image without publishing
    id: build
    uses: docker/build-push-action@v7
    with:
      context: .
      platforms: linux/amd64
      push: false
      outputs: type=oci,dest=${{ runner.temp }}/${{ inputs.image_name }}.tar
      # Keep Buildx's existing publication provenance policy.
      provenance: ${{ github.event.repository.private && 'mode=min' || 'mode=max' }}
      labels: ${{ inputs.image_labels || steps.meta.outputs.labels }}
      cache-from: type=gha
      cache-to: type=gha,mode=max

  - name: Install OCI transport
    shell: bash
    run: |
      if ! command -v skopeo >/dev/null; then
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends skopeo
      fi

  - name: Install Trivy
    uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
    with:
      version: v0.70.0
      cache: true

  - name: Reject fixable high or critical image vulnerabilities
    id: scan
    shell: bash
    env:
      IMAGE_ARCHIVE: ${{ runner.temp }}/${{ inputs.image_name }}.tar
      EXPECTED_DIGEST: ${{ steps.build.outputs.digest }}
    run: bash scripts/ci/scan-image-archive.sh "$IMAGE_ARCHIVE" linux/amd64 "$EXPECTED_DIGEST"

  - name: Login to GitHub Container Registry
    if: ${{ inputs.push_to_ghcr == 'true' }}
    uses: docker/login-action@v4
    with:
      registry: ${{ env.REGISTRY }}
      username: ${{ github.actor }}
      password: ${{ inputs.github_token }}

  - name: Publish the scanned archive without rebuilding
    id: publish
    if: ${{ inputs.push_to_ghcr == 'true' }}
    shell: bash
    env:
      IMAGE_ARCHIVE: ${{ runner.temp }}/${{ inputs.image_name }}.tar
      IMAGE_TAGS: ${{ inputs.image_tags || steps.meta.outputs.tags }}
      EXPECTED_DIGEST: ${{ steps.build.outputs.digest }}
      EXPECTED_ARCHIVE_SHA256: ${{ steps.scan.outputs.archive_sha256 }}
    run: bash scripts/ci/publish-image-archive.sh "$IMAGE_ARCHIVE" "$EXPECTED_DIGEST" "$EXPECTED_ARCHIVE_SHA256"
